name: Build QMK firmware
on:
    push:
        paths:
            - "keyboards/**"
            - "qmk.json"
            - ".github/workflows/qmk-build.yml"
    pull_request:
        paths:
            - "keyboards/**"
            - "qmk.json"
            - ".github/workflows/qmk-build.yml"
    workflow_dispatch:

jobs:
    build:
        uses: qmk/qmk_userspace/.github/workflows/qmk_userspace.yml@main
        with:
            qmk_repo: qmk/qmk_firmware
            qmk_ref: master
