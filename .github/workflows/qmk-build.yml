name: Build QMK firmware
on:
  push:
    paths:
      - "keyboards/**"
      - ".github/workflows/qmk-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    strategy:
      fail-fast: false
      matrix:
        keymap: [default, dvorak]
    steps:
      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout QMK firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          path: qmk_firmware
          submodules: recursive

      - name: Install QMK firmware Python dependencies
        run: pip install -r qmk_firmware/requirements.txt

      - name: Link custom keyboard into qmk_firmware
        run: ln -s "$GITHUB_WORKSPACE/keyboards/dactyl_cc" qmk_firmware/keyboards/dactyl_cc

      - name: Build firmware
        working-directory: qmk_firmware
        run: qmk compile -kb dactyl_cc -km ${{ matrix.keymap }}

      - name: Archive firmware
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dactyl_cc_${{ matrix.keymap }}
          path: |
            qmk_firmware/*.hex
            qmk_firmware/*.bin
            qmk_firmware/*.uf2
