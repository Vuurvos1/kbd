name: Build QMK firmware
on:
    push:
        paths:
            - "keyboards/**"
            - "qmk.json"
            - ".github/workflows/qmk-build.yml"
    pull_request:
        paths:
            - "keyboards/**"
            - "qmk.json"
            - ".github/workflows/qmk-build.yml"
    workflow_dispatch:

jobs:
    build:
        uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
        with:
            qmk_repo: qmk/qmk_firmware
            qmk_ref: master
