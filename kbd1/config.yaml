meta:
  engine: 4.1.0
points:
  zones:
    matrix:
      columns:
        outer:
          key.column_net: P002
        pinky:
          key.column_net: P115
        ring:
          key.stagger: 5
          key.column_net: P113
        middle:
          key.stagger: 3
          key.column_net: P111
        index:
          key.stagger: -3
          key.column_net: P010
        inner:
          key.stagger: -2
          key.column_net: P009
      rows:
        mod:
          row_net: P104
        bottom:
          row_net: P011
        home:
          row_net: P100
        top:
          row_net: P024
      anchor:
        # Shift the PCB to the right and down, otherwise it's weirdly positioned outside of the main sheet in KiCad
        shift: [100, -150]

    thumbfan:
      anchor:
        ref: matrix_index_mod
        shift: [-0.5u, -1u]
      columns:
        near:
          key.column_net: P113
        home:
          key.spread: 21.25
          key.splay: -15
          key.stagger: -3
          key.column_net: P111
        far:
          key:
            column_net: P010
            height: 1.25u
            splay: -15
            shift: [2.5, 0.8]
      rows:
        thumb:
          row_net: P106

    thumbtop:
      anchor:
        ref: matrix_inner_mod
        shift: [1u, 0u]
      columns:
        top:
          key:
            column_net: P009
            height: 1u
      rows:
        thumb:
          row_net: P106

  mirror:
    ref: matrix_pinky_home
    distance: 250

outlines:
  pcb:
    - what: polygon
      operation: stack
      # counter clockwise
      points:
        # top left corner
        - ref: matrix_outer_top
          shift: [-0.5u - 1, 0.5u + 1]

        - ref: matrix_outer_mod
          shift: [-0.5u - 1, -0.5u - 1]
        - ref: matrix_outer_mod
          shift: [2.5u + 1, -0.5u - 1]

        # thumb fan start (bottom left of first switch)
        - ref: thumbfan_near_thumb
          shift: [-0.5u - 1, -0.5u - 1]
        - ref: thumbfan_far_thumb
          shift: [-0.5u + 1.5, -0.8u]

        - ref: thumbfan_far_thumb
          shift: [0.5u + 1, -0.8u]
        - ref: thumbfan_far_thumb
          shift: [0.5u + 1, 0.8u]

        # top rightcorner
        - ref: matrix_inner_top
          shift: [1.5u + 1.75, 0.5u + 1]

        - ref: matrix_inner_top
          shift: [-0.5u + 2.5, 0.5u + 1]

        - ref: matrix_index_top
          shift: [0.5u - 2.5, 0.5u + 3 + 1]

        - ref: matrix_ring_top
          shift: [-0.5u + 2, 0.5u + 3 + 1]

        - ref: matrix_pinky_top
          shift: [0.5u - 2, 0.5u + 1]

  # Rectangle to create a straight vertical right edge
  # Positioned so its left edge aligns with matrix_inner_top right edge
  right_edge_bound:
    - what: rectangle
      where:
        ref: matrix_inner_top
        shift: [2.5u + 1, -1u] # left edge at the top right corner X, shifted left by half width
      size: [2u, 10u] # large enough to cover the entire keyboard

  # USB-C cable cutout - 13mm wide, positioned above the nice_nano
  usb_cutout:
    - what: rectangle
      where:
        ref: matrix_inner_top
        shift: [18.5, 0.5u + 4 - 2] # centered above nice_nano, extending beyond PCB edge
      size: [13, 10] # 13mm wide, tall enough to cut through edge
      fillet: 2 # 2mm rounded corners

  pcb_trimmed:
    - name: pcb
    - operation: subtract
      name: right_edge_bound
      fillet: 5
    - operation: subtract
      name: usb_cutout

  # left:
  #   - where: true
  #     what: rectangle
  #     size: [cx + 2, cy + 2] # this is choc spacing
  #     fillet: 2
  leftkeys:
    - where: true
      what: rectangle
      size: [14, 14]

  switchplatecutout:
    - what: polygon
      operation: stack
      fillet: 0
      points:
        # top left corner
        - ref: matrix_inner_top
          shift: [0.5u, 1u]
        - ref: matrix_inner_top
          shift: [2u, 1u]
        # bottom right corner
        - ref: matrix_inner_top
          shift: [2u, -1.5u]
        - ref: matrix_inner_top
          shift: [0.5u, -1.5u]

  switchplateoutline:
    - name: pcb_trimmed
    - operation: subtract
      name: switchplatecutout

  switchplate:
    - name: switchplateoutline
    - operation: subtract
      name: leftkeys

pcbs:
  left:
    outlines:
      main:
        outline: pcb_trimmed
    footprints:
      keyswitches:
        where: true
        what: ks33_mx_hotswap
        params:
          from: '{{column_net}}'
          to: '{{colrow}}'
      diode:
        what: custom_diode
        where: true
        params:
          from: '{{colrow}}'
          to: '{{row_net}}'
        adjust:
          shift: [0, -4.5]
          rotate: 0
      nice_nano_left:
        what: nice_nano_low_profile
        params:
          orientation: down
        where:
          ref: matrix_inner_top
          shift: [18.5, -10]
          rotate: -90.0
      nice_nano_right:
        what: nice_nano_low_profile
        params:
          orientation: down
        where:
          ref: mirror_matrix_inner_top
          shift: [20.5, -10]
          rotate: 90.0
      nice_view:
        what: nice_view
        params:
          SDA: P020
          SCL: P017
          CS: P006
        where:
          ref: matrix_inner_top
          shift: [18.5, -28.25]
          rotate: 90.0
      # Battery jack
      jstph:
        what: jstph
        where:
          ref: matrix_inner_top
          shift: [22.75, -35]
          rotate: -90
        params:
          side: B
          pos: pos
          neg: GND
      # Reset switch (horizontal community version)
      horizontal_reset:
        what: EVQPUC
        params:
          side: F
          from: GND
          to: RST
        where:
          ref: matrix_inner_bottom
          shift: [0.5u + 18, 3]
          rotate: -90.0
      # Battery on/off switch
      battery_switch:
        what: slider
        where:
          ref: matrix_inner_bottom
          shift: [0.5u + 18, -6]
          rotate: -90
        params:
          side: F
          from: pos
          to: RAW
      # Mounting holes
      hole_top_left:
        what: mountinghole
        where:
          ref: matrix_outer_top
          shift: [0.5u, -0.5u]
      hole_bottom_left:
        what: mountinghole
        where:
          ref: matrix_outer_bottom
          shift: [0.5u, -0.5u]
      hole_top_right:
        what: mountinghole
        where:
          ref: matrix_inner_top
          shift: [-0.5u, -0.5u + 1]
      hole_bottom_right:
        what: mountinghole
        where:
          ref: matrix_inner_bottom
          shift: [-0.5u, -0.5u + 1]
      hole_thumb_fan:
        what: mountinghole
        where:
          ref: thumbfan_far_thumb
          shift: [-0.5u, 0.5u]

cases:
  plate:
    - name: switchplate
      extrude: 1.8
