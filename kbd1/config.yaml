meta:
  engine: 4.1.0
points:
  zones:
    matrix:
      columns:
        outer:
          key.column_net: P002
        pinky:
          key.column_net: P115
        ring:
          key.stagger: 5
          key.column_net: P113
        middle:
          key.stagger: 2
          key.column_net: P111
        index:
          key.stagger: -2
          key.column_net: P010
        inner:
          key.stagger: -2
          key.column_net: P009
      rows:
        mod:
          row_net: P104
        bottom:
          row_net: P011
        home:
          row_net: P100
        top:
          row_net: P024
      anchor:
        # Shift the PCB slightly to the right and down, otherwise it's weirdly positioned outside of the main sheet in KiCad
        shift: [100, -150]

    thumbfan:
      anchor:
        ref: matrix_index_mod
        shift: [-0.5u, -1u]
      columns:
        near:
          key.column_net: P113
        home:
          key.spread: 21.25
          key.splay: -15
          # key.origin: [-11.75, -9]
          key.stagger: -3
          key.column_net: P111
        far:
          key:
            column_net: P010
            height: 1.5u
            splay: -15
            shift: [2, 3.5]
        top:
          key:
            column_net: P009
            height: 1u
            splay: 30
            shift: [-8.5, 36]
      rows:
        thumb:
          row_net: P106
  mirror:
    ref: matrix_pinky_home
    distance: 250

outlines:
  pcb:
    - what: polygon
      operation: stack
      fillet: 1
      points:
        # top left corner
        - ref: matrix_outer_top
          shift: [-0.5u, 0.5u]

        - ref: matrix_outer_mod
          shift: [-0.5u, -0.5u]
        - ref: matrix_outer_mod
          shift: [2.5u, -0.5u]

        - ref: thumbfan_near_thumb
          shift: [-0.5u, -0.5u]
        - ref: thumbfan_far_thumb
          shift: [-0.5u + 1.5, -0.8u]

        - ref: thumbfan_far_thumb
          shift: [0.5u, -0.8u]
        - ref: thumbfan_far_thumb
          shift: [0.5u, 0.8u]

        # top rightcorner
        - ref: matrix_inner_top
          shift: [1.5u + 1.75, 0.5u -2]

        - ref: matrix_inner_top
          shift: [0.5u, 0.5u -2]
        - ref: matrix_inner_top
          shift: [0.5u, 0.5u]

        - ref: matrix_inner_top
          shift: [-0.5u, 0.5u]

        - ref: matrix_inner_top
          shift: [-0.5u, 0.5u]

        - ref: matrix_index_top
          shift: [0.5u, 0.5u]
        - ref: matrix_index_top
          shift: [-0.5u, 0.5u]

        - ref: matrix_middle_top
          shift: [0.5u, 0.5u]
        - ref: matrix_middle_top
          shift: [-0.5u, 0.5u]

        - ref: matrix_ring_top
          shift: [0.5u, 0.5u]
        - ref: matrix_ring_top
          shift: [-0.5u, 0.5u]

        - ref: matrix_pinky_top
          shift: [0.5u, 0.5u]
  # left:
  #   - where: true
  #     what: rectangle
  #     size: [cx + 2, cy + 2]
  #     fillet: 2
  leftkeys:
    - where: true
      what: rectangle
      size: [14, 14]
      # size: [14.5, 14.5] for 3d print

  switchplatecutout:
    - what: polygon
      operation: stack
      fillet: 0
      points:
        # top left corner
        - ref: matrix_inner_top
          shift: [0.5u, 1u]
        - ref: matrix_inner_top
          shift: [2u, 1u]
        # bottom right corner
        - ref: matrix_inner_top
          shift: [2u, -2u]
        - ref: matrix_inner_top
          shift: [0.5u, -2u]

  switchplateoutline:
    - name: pcb
    - operation: subtract
      name: switchplatecutout
      fillet: 1

  switchplate:
    - name: switchplateoutline
    - operation: subtract
      name: leftkeys

pcbs:
  left:
    outlines:
      main:
        outline: pcb
    footprints:
      keyswitches:
        where: true
        what: mx
        params:
          hotswap: true
          from: '{{column_net}}'
          to: '{{colrow}}'
      # Main diodes
      diode:
        what: diode
        where: true
        params:
          from: '{{colrow}}'
          to: '{{row_net}}'
        adjust:
          shift: [0, -4.5]
          rotate: 0
      nice_nano_left:
        what: nice_nano
        params:
          orientation: down
        where:
          ref: matrix_inner_top
          shift: [20, -12]
          rotate: -90.0
      nice_nano_right:
        what: nice_nano
        params:
          orientation: down
        where:
          ref: mirror_matrix_inner_top
          shift: [20, -12]
          rotate: 90.0
      nice_view:
        what: nice_view
        params:
          SDA: P020
          SCL: P017
          CS: P006
        where:
          ref: matrix_inner_top
          shift: [20, -30]
          rotate: 90.0
      # Battery jack
      jstph:
        what: jstph
        where:
          ref: matrix_inner_bottom
          shift: [23, 4]
          rotate: -90
        params:
          side: B
          pos: pos
          neg: GND
      # Reset switch (horizontal community version)
      horizontal_reset:
        what: EVQPUC
        params:
          side: F
          from: GND
          to: RST
        where:
          ref: matrix_inner_bottom
          shift: [0.5u + 19, 2.8]
          rotate: -90.0
      # Battery on/off switch
      battery_switch:
        what: slider
        where:
          ref: matrix_inner_bottom
          shift: [0.5u + 19, -6.0]
          rotate: -90
        params:
          side: F
          from: pos
          to: RAW
      # Mounting holes
      hole_top_left:
        what: mountinghole
        where:
          ref: matrix_outer_top
          shift: [0.5u, -0.5u]
      hole_bottom_left:
        what: mountinghole
        where:
          ref: matrix_outer_bottom
          shift: [0.5u, -0.5u]
      hole_top_right:
        what: mountinghole
        where:
          ref: matrix_inner_top
          shift: [-0.5u, -0.5u + 1]
      hole_bottom_right:
        what: mountinghole
        where:
          ref: matrix_inner_bottom
          shift: [-0.5u, -0.5u + 1]
      hole_thumb_fan:
        what: mountinghole
        where:
          ref: thumbfan_far_thumb
          shift: [-0.5u, 0.5u]

cases:
  plate:
    - name: switchplate
      extrude: 1.2
